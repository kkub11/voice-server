services:
  speaches:
    # Pinned because "latest-cpu" was reported to resolve to the older 0.8.3.
    # If this tag is gone, check https://github.com/speaches-ai/speaches/pkgs/container/speaches
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: speaches
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # int8 keeps CPU inference fast and memory low
      - WHISPER__COMPUTE_TYPE=int8
      # Model(s) downloaded at startup. Start small, then try larger ones.
      - 'PRELOAD_MODELS=["Systran/faster-whisper-small"]'
    volumes:
      # Keeps downloaded models across restarts
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub

volumes:
  hf-hub-cache:
