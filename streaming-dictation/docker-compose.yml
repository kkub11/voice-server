# LocalAI — streaming transcription test server
services:
  localai:
    image: localai/localai:latest
    container_name: localai
    # cpus raised 3.0 -> 4.0 (2026-11-15): the debug log showed each
    # Silero VAD pass taking 3-4 s and the live decode ~1 s behind
    # real time on a 6-core box where Frigate already uses ~4.2 cores.
    # (The --log-level=debug command used during the 2026-11-15
    # diagnosis was removed 2026-11-16 -- logs are back to normal.)
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
      - localai-backends:/backends
      - localai-config:/configuration
      - localai-data:/data
    environment:
      - MODELS_PATH=/models
      - BACKENDS_PATH=/backends
      - LOCALAI_CONFIG_DIR=/configuration
      - LOCALAI_DATA_PATH=/data
    cpus: "4.0"
    mem_limit: "5g"
    restart: unless-stopped

volumes:
  localai-backends:
  localai-config:
  localai-data:
