# Streaming dictation pipeline, Nemotron variant — the punctuation fix.
# Same shape as dictate-streaming.yaml, but the transcription model is
# NVIDIA Nemotron Speech Streaming EN 0.6B instead of Parakeet EOU 120M.
# Nemotron punctuates and capitalizes natively (NVIDIA's own NeMo
# voice-agent README: EOU "does not support punctuation and
# capitalization"; Nemotron "supports punctuation and capitalization"),
# and is more accurate (6.93% WER at 1.12 s lookahead vs 9.30%).
#
# Two behaviour differences vs the EOU pipeline:
# 1. No EOU token: Nemotron does not predict end-of-utterance, so
#    semantic_vad could only commit a turn on its eagerness silence
#    timeout (2 s on high, the fastest setting) — measured ~2.4 s of
#    lag after speech ended. server_vad commits after its default
#    500 ms silence instead (switched 2026-11-26), so text lands
#    about a second sooner. Pauses longer than ~0.5 s split the
#    dictation into turns; Dictate still holds the dictation open
#    until YOU stop it — silence never ends it; a turn commit only
#    finalizes the text of that chunk.
# 2. Text arrives per VAD-committed turn, not word-by-word
#    mid-utterance: server_vad transcribes each committed turn as a
#    whole, and the nemo-speech-cpp backend drops interim hypotheses
#    anyway (forwarding them would assemble "he", "hell", "hello",
#    "Hello." into "hehellhelloHello."). So the visible text lands
#    at pauses rather than as a live word stream.
# The LLM (Qwen3 0.6B) is in the pipeline because LocalAI's examples
# show all four stages; it is loaded but idle in a transcription-only
# session. There is deliberately NO tts stage (qwen3-tts-cpp-customvoice
# crashes on load and fails realtime warmup — see dictate-streaming.yaml).

name: dictate-streaming-nemotron
pipeline:
  vad: silero-vad-ggml
  transcription: nemotron-speech-streaming-en-0.6b
  llm: qwen3-0.6b
  streaming:
    transcription: true
  turn_detection:
    type: server_vad
    # Wide VAD scan window: speech buffered during session warmup
    # replays as a burst, and the default 1.5s scan clip plus the
    # no-speech clear can cut its first word (2026-11-27). Scanning
    # 30s costs a few ms of silero per tick.
    vad_window_sec: 30
    # Silence window is the server_vad default (500 ms); the
    # pipeline schema has no field to tune it.
