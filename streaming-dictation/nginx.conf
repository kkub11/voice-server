# Tiny rewrite proxy in front of LocalAI, for Dictate's realtime mode.
#
# Why it exists: LocalAI picks the realtime pipeline ONLY from the
# ?model= query parameter of the websocket URL
# (core/http/endpoints/openai/realtime.go: model := c.QueryParam("model")).
# Dictate's realtime client always connects to
# ws://host/v1/realtime?intent=transcription — with no model in the URL —
# so LocalAI answers "model is not a pipeline" (model="") and closes the
# session, and Dictate silently falls back to batch. Dictate has no field
# for the realtime URL, and its batch URL is built by plain string concat
# off the same base URL, so the model can't be smuggled in there either
# (a base URL containing /realtime?model=... would corrupt the batch URL).
# This proxy adds ?model=dictate-streaming to the realtime handshake and
# passes everything else through unchanged.
#
# Why the address is built with a variable ($backend): with a static
# proxy_pass URI, nginx appends the client's original query string to the
# replacement — so the first version of this file sent LocalAI
# ?model=dictate-streaming?intent=transcription, and LocalAI read the
# model name as "dictate-streaming?intent=transcription". With a variable
# in proxy_pass, nginx passes the URI exactly as written, original query
# dropped (nginx.org proxy_pass docs: "if URI is specified in the
# directive, it is passed to the server as is"). The variable form needs
# a resolver, so Docker's embedded DNS (127.0.0.11) is configured below.

events {}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;

        # Dictate's realtime handshake: send exactly
        # /v1/realtime?model=dictate-streaming to LocalAI. Long timeouts:
        # a realtime session stays open for the whole recording.
        location = /v1/realtime {
            set $backend localai:8080;
            proxy_pass http://$backend/v1/realtime?model=dictate-streaming;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else (batch transcription, /v1/models, web UI) passes through.
        location / {
            set $backend localai:8080;
            proxy_pass http://$backend;
        }
    }
}
